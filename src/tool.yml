tools:
  profile:
    title: Dataset Profile
    description: |
      Create a HTML or JSON profiling report for any kind of tabular data.
      Uses ydata-profiling (Python): https://pypi.org/project/ydata-profiling/
      Uses sweetviz (Python): https://pypi.org/project/sweetviz/
    command: "python run.py"
    parameters:
      title:
        type: string
        description: The title used in the report
        default: "Dataset Report"
    data:
      dataframe:
        example: /in/dataframe.csv
        extension:
          - csv
          - parquet
        description: |
          Tabular data file (CSV or Parquet). From Python SDK you can pass any pandas.DataFrame.
          Other formats may be supported depending on the runtime.
